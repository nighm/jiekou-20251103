# JMeter Test Suite v2.0 Configuration File
# Colleagues only need to modify the 3 parameters below

# Main Configuration (3 parameters to modify)

# 1. Thread range (format: "min max step")
# Example: "10 50 20" means test with 10, 30, 50 threads (3 groups)
# 2小时测试规划（Debug优先 + 其他测试）：
#   执行顺序：200→300→400→500→600（逐步增压，最后验证600×20 bug）
#   预计时间：每轮3-5分钟 × 5轮 = 15-25分钟，剩余时间做其他测试
thread_range: "700 1000 100"

# 2. Loop range (format: "min max step")  
# Example: "3 10 2" means test with 3, 5, 7, 9 loops (4 groups)
# 2小时测试规划：固定20循环（验证bug的关键参数）
#   600×20循环是bug场景，必须验证
#   200-500×20循环用于其他测试和对比
loop_range: "100 100 0"

# 3. Test plan selection (choose one JMX file to run)
# Available test plans in src/jmeter_test_suite/infrastructure/config/test_plans/:
#   "01_register.jmx"        # User registration API
#   "02_device_strategy.jmx" # Device strategy API (default)
#   "03_device_name.jmx"     # Device name API
#   "04_device_mode.jmx"     # Device mode API
#   "05_device_vendor.jmx"   # Device vendor API
#   "06_device_protect.jmx"  # Device protection API
#   "07_device_logo.jmx"     # Device logo API
#   "08_device_mqtt.jmx"     # Device MQTT API
#   "09_device_heartbeat.jmx"# Device heartbeat API
test_plans:
  - "09_device_heartbeat.jmx"

# System Configuration (usually no need to change)
# JMeter命令配置说明：
# 1. 推荐方式：将JMeter添加到系统PATH，然后设置为 "jmeter"
#    Windows: 添加 JMeter的bin目录到PATH，使用 "jmeter.bat" 或 "jmeter"
#    Linux/macOS: 添加 JMeter的bin目录到PATH，使用 "jmeter"
# 2. 环境变量方式（优先）：
#    设置环境变量 JMETER_HOME（JMeter安装目录）或 JMETER_PATH（完整路径）
#    例如：export JMETER_HOME=/opt/apache-jmeter-5.6.3
# 3. 完整路径方式（不推荐，仅当JMeter不在PATH中时使用）：
#    Windows: "D:\\tools\\apache-jmeter-5.6.3\\bin\\jmeter.bat"
#    Linux: "/opt/apache-jmeter-5.6.3/bin/jmeter"
#    macOS: "/usr/local/apache-jmeter-5.6.3/bin/jmeter"
jmeter_command: "jmeter"  # 默认使用PATH中的jmeter命令（推荐）
result_dir: "./result"
test_plans_dir: "./src/jmeter_test_suite/infrastructure/config/test_plans"

# 辅助端日志采集配置
log_capture:
