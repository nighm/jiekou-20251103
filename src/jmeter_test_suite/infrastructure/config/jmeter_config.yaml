  mode: "ssh_remote"               # 分布式模式: jmeter_native, ssh_remote
  slaves:
    - name: "slave1"
      host: "192.168.24.200"       # 笔记本2的IP地址
      port: 22                     # SSH端口
      username: "nighm"            # SSH用户名
      password: "bios99"           # SSH密码
      # JMeter路径（分布式模式）
      # 配置说明：可以是完整路径或命令名（如果在PATH中）
      # Windows示例: "D:\\apache-jmeter-5.6.3\\bin\\jmeter.bat" 或 "jmeter.bat"
      # Linux示例: "/opt/apache-jmeter-5.6.3/bin/jmeter" 或 "jmeter"
      jmeter_path: "jmeter"  # 默认使用PATH中的jmeter命令（推荐）
      thread_ratio: 1.0            # 线程分配比例 (1.0 = 100%，只有一个slave)
