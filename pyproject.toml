[build-system]
requires = ["setuptools>=69.0", "wheel", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jmeter-test-suite"
dynamic = ["version"]
description = "JMeter and nmon performance testing data collection and Excel report generation tool with cross-platform support and enhanced Excel reporting"
readme = {file = "README.md", content-type = "text/markdown; charset=UTF-8"}
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "nighm", email = "nighm@sina.com"}
]
maintainers = [
    {name = "nighm", email = "nighm@sina.com"}
]
keywords = ["jmeter", "nmon", "testing", "excel", "performance", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0.3",
    "paramiko>=4.0.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pillow>=12.0.0",
    "numpy>=2.3.4",
    "dataclasses>=0.6; python_version<'3.7'",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.4.0",
]
lint = [
    "mypy>=1.18.2",
    "ruff>=0.14.4",
    "autoflake>=2.3.1",
    "pycln>=2.4.0",
    "types-paramiko>=4.0.0.20250822",
    "types-PyYAML>=6.0.12.20250915",
    "types-openpyxl>=3.1.5.20250919",
    "pandas-stubs>=2.3.2.250926",
    "pillow>=12.0.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.0",
]
ci = [
    "tox>=4.32.0",
    "coverage[toml]>=7.11.3",
]
security = [
    "pip-audit>=2.9.0",
    "bandit>=1.8.6",
]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.4.0",
    "mypy>=1.18.2",
    "ruff>=0.14.4",
    "autoflake>=2.3.1",
    "pycln>=2.4.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.0",
    "tox>=4.32.0",
    "coverage[toml]>=7.11.3",
    "pip-audit>=2.9.0",
    "bandit>=1.8.6",
    "pre-commit>=4.4.0",
    "pip-tools>=7.5.1",
]

[project.urls]
Homepage = "https://gitee.com/nighm/jiekou-20251103"
Repository = "https://gitee.com/nighm/jiekou-20251103"
Issues = "https://gitee.com/nighm/jiekou-20251103/issues"
Documentation = "https://gitee.com/nighm/jiekou-20251103#readme"
Changelog = "https://gitee.com/nighm/jiekou-20251103/releases"
CI = "https://gitee.com/nighm/jiekou-20251103/actions"

[project.scripts]
jmeter-test-suite = "jmeter_test_suite.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
exclude = [
    "tests",
    "tests.*",
    "docs",
    "docs.*",
    "temp",
    "temp.*",
    "tools",
    "tools.*",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"jmeter_test_suite" = [
    "**/*.yaml",
    "**/*.yml",
    "**/*.json",
    "**/*.jmx",
    "**/*.csv",
    "**/*.xlsx",
    "**/*.ini",
    "**/*.template",
    "_version.py",
]

[tool.setuptools_scm]
fallback_version = "7.0.0"
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"
tag_regex = "^v?(?P<version>\\d+\\.\\d+\\.\\d+)$"
write_to = "src/jmeter_test_suite/_version.py"

[tool.ruff]
# 使用 Ruff 统一处理格式化、Lint 与导入排序
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "A", "ARG", "C4", "SIM", "TID"]
ignore = []
fixable = ["ALL"]
unfixable = []

# 针对导入整理补充定制化控制
[tool.ruff.lint.isort]
known-first-party = ["jmeter_test_suite"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "preserve"
indent-style = "space"
line-ending = "lf"

[tool.bandit]
skips = ["B101"]
exclude_dirs = ["tests", "docs", "temp"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "jmeter_test_suite.infrastructure.reporting.daily_report_generator",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "pandas",
    "pandas.*",
    "openpyxl",
    "openpyxl.*",
    "paramiko",
    "paramiko.*",
    "yaml",
    "yaml.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--strict-config",
    "--disable-warnings",
    "--color=yes",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow tests",
    "quality: Code quality validation",
]
timeout = 300
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["src/jmeter_test_suite"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
fail_under = 80
show_missing = true

[tool.coverage.html]
directory = "build/coverage-html"

[tool.coverage.xml]
output = "build/coverage.xml"

[tool.coverage.paths]
source = [
    "src/jmeter_test_suite",
    "*/site-packages/jmeter_test_suite",
]

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py312, lint
skip_missing_interpreters = true

[testenv]
deps = .[test]
commands =
    pytest

[testenv:lint]
deps = .[lint]
commands =
    ruff check src tests
    ruff format --check src tests
    mypy src
"""

[tool.pip-tools]
allow_unsafe = false
generate_hashes = false
resolver = "backtracking"
